<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RFID Attendance System</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      color: white;
    }

    .card {
      background: white;
      color: #333;
      width: 380px;
      padding: 25px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }

    .card h1 {
      margin-top: 0;
      color: #1e3c72;
    }

    .photo {
      width: 180px;
      height: 180px;
      margin: 15px auto;
      border-radius: 50%;
      border: 5px solid #1e3c72;
      object-fit: cover;
      background: #eee;
    }

    .info {
      font-size: 16px;
      margin: 8px 0;
    }

    .status {
      margin-top: 15px;
      padding: 10px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 18px;
    }

    .checkin {
      background: #d4edda;
      color: #155724;
    }

    .checkout {
      background: #f8d7da;
      color: #721c24;
    }

    .waiting {
      background: #eee;
      color: #555;
    }

    .time {
      margin-top: 10px;
      font-size: 13px;
      color: #666;
    }
  </style>
</head>

<body>

<div class="card">
  <h1>Attendance</h1>

  <img id="photo" class="photo" src="" alt="Student Photo">

  <div class="info"><strong>Name:</strong> <span id="name">Waiting for scan...</span></div>
  <div class="info"><strong>ID:</strong> <span id="studentID">—</span></div>

  <div id="statusBox" class="status waiting">Tap your ID card</div>

  <div class="time" id="time"></div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwXc4oPj7NbIapbzjdf1msJN0pi0JWv2-uQP3wrleKO2pNM78OghyxAZ--A0SpeNeNq/exec";

async function fetchLatest() {
  try {
    const res = await fetch(API_URL);
    const data = await res.json();

    if (data.length === 0) return;

    const last = data[data.length - 1];

    document.getElementById("photo").src = last.photo;
    document.getElementById("name").innerText = last.name;
    document.getElementById("studentID").innerText = last.studentID;
    document.getElementById("time").innerText = last.timestamp;

    const statusBox = document.getElementById("statusBox");
    statusBox.innerText = last.status;

    if (last.status === "CHECK-IN") {
      statusBox.className = "status checkin";
    } else {
      statusBox.className = "status checkout";
    }

  } catch (err) {
    console.error("Fetch error:", err);
  }
}

setInterval(fetchLatest, 2000); // refresh every 2 seconds
</script>

</body>
</html>
